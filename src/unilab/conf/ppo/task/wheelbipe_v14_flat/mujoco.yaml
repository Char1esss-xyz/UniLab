  sim_dt: 0.005
  ctrl_dt: 0.02
  max_episode_seconds: 20.0
  manager_torch_device: cpu
  policy_observation_group: policy
  critic_observation_group: critic
  actions:
    motors:
      _target_: unilab.tasks.locomotion.wheelbipe_v14.controller.WheelbipeMotorCfg
      entity_name: robot
      domain_randomization: true
      observation_noise: true
      delays: true
      steps_per_iteration: ${algo.num_steps_per_env}
  observations:
    policy:
      terms:
        state:
          func: unilab.tasks.locomotion.wheelbipe_v14.controller.observe
          params:
            group: policy
    critic:
      terms:
        state:
          func: unilab.tasks.locomotion.wheelbipe_v14.controller.observe
          params:
            group: critic
  events:
    reset_robot:
      func: unilab.tasks.locomotion.wheelbipe_v14.controller.reset_robot
      mode: reset
    advance_commands:
      func: unilab.tasks.locomotion.wheelbipe_v14.controller.advance_commands
      mode: step
  terminations:
    fallen:
      func: unilab.tasks.locomotion.wheelbipe_v14.controller.terminated
    time_out:
      func: unilab.tasks.locomotion.wheelbipe_v14.controller.time_out
      time_out: true
