defaults:
- _self_
- task: wheelbipe_v14_flat/mujoco
algo:
  algo: ppo
  algo_log_name: rsl_rl_ppo
  seed: 1
  num_envs: 4096
  num_steps_per_env: 24
  max_iterations: 20000
  save_interval: 500
  obs_groups:
    actor:
    - actor
    critic:
    - critic
  experiment_name: wheelbipe_v14_flat
  run_name: ''
  resume: false
  load_run: '-1'
  checkpoint: -1
  resume_path: null
  actor:
    class_name: rsl_rl.models.MLPModel
    hidden_dims:
    - 256
    - 128
    - 64
    activation: elu
    obs_normalization: false
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 1.0
      std_type: scalar
  critic:
    class_name: rsl_rl.models.MLPModel
    hidden_dims:
    - 256
    - 128
    - 64
    activation: elu
    obs_normalization: false
  algorithm:
    class_name: rsl_rl.algorithms:PPO
    value_loss_coef: 4.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.0001
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
training:
  task_name: WheelbipeV14Flat
  dp_collector_cpu_ids: null
  device: null
  logger: tensorboard
  log_interval: 1
  wandb_project: unilab
  wandb_entity: null
  wandb_group: null
  wandb_job_type: null
  wandb_name: null
  wandb_tags: []
  wandb_notes: null
  wandb_mode: null
  sim_backend: mujoco
  collector_tensor_device: cpu
  nan_guard:
    enabled: true
    buffer_size: 100
    max_envs_to_dump: 5
    output_dir: null
  play_only: false
  no_play: true
  sim2sim_strict: true
  play_render_mode: auto
  play_env_num: 16
  render_spacing: 1.0
  play_steps: 200
  cam_distance: 6.0
  cam_elevation: -20.0
  cam_azimuth: 90.0
  cam_lookat: null
  cam_tracking: false
  cam_tracking_env_idx: 0
  cam_tracking_extra_envs: 2
  log_root: null
  num_timesteps: null
  log_dir: null
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers:
      - console
