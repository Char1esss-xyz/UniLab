[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "unilab"
version = "1.3.4"
description = "Wheelbipe V14 Flat PPO training with MuJoCo"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UniLab Authors" }]
keywords = ["robot-learning", "reinforcement-learning", "mujoco", "simulation"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "unisim-core>=1.7.15",
    "mujoco~=3.11.0",
    "mjbatch-uni~=0.2.5",
    "prettytable>=3.10",
    # A range (not an exact pin) lets ROCm users substitute a ROCm torch
    # build; uv.lock pins the tested CUDA builds via tool.uv.sources.
    "torch>=2.9,<2.15",
    "gymnasium",
    "hydra-core>=1.3",
    "tensordict",
    "rsl-rl-lib>=5.0.0",
    "tensorboard>=2.21.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "setuptools",
    "typing-extensions",
]

[project.scripts]
train = "unilab.cli:train_main"
play = "unilab.cli:play_main"
control = "unilab.cli:control_main"
manual-play = "unilab.cli:manual_play_main"

[project.optional-dependencies]
mjwarp = ["mujoco-warp~=3.11.0", "warp-lang==1.16.0"]

[project.urls]
Homepage = "https://unilabsim.github.io"
Documentation = "https://unilabsim.github.io/UniLab-doc/"
Repository = "https://github.com/unilabsim/UniLab"
Issues = "https://github.com/unilabsim/UniLab/issues"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pyright>=1.1.408"]

[[tool.uv.index]]
name = "r2-cu130"
url = "https://download-r2.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# cu130 carries torch>=2.12 CUDA wheels for linux/win; macOS resolves from PyPI.
torch = [
    { index = "r2-cu130", marker = "sys_platform=='linux' or sys_platform=='win32'" },
]

[tool.uv]
exclude-dependencies = ["torchvision"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
extend-exclude = [".history"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",
    "N806",
    "E402",
    "F401",
    "N801",
    "F821",
    "E741",
    "N802",
    "N803",
    "N812",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_site_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running training or script smoke tests, or cumulatively expensive backend matrices",
]
addopts = "--tb=short -m 'not slow'"

[tool.coverage.run]
source = ["src/unilab"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["src/unilab"]
exclude = [
    "src/unilab/envs/",                     # lazy optional `mujoco` import; not installed in the pyright env
    "src/unilab/visualization/",            # direct mujoco C bindings; not installed in the pyright env
]
reportMissingImports = "warning"
reportMissingModuleSource = "none"
